<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sound — Coming to Steam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Syne+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#f0eee8;
  --ink2:rgba(240,238,232,.5);
  --ink3:rgba(240,238,232,.25);
  --paper:#0d0d10;
  --paper2:#141418;
  --paper3:#1c1c22;
  --line:rgba(240,238,232,.08);
  --line2:rgba(240,238,232,.14);
  --g1:#ff6b35;
  --g2:#e040fb;
  --g3:#00e5ff;
  --mono:'Syne Mono',monospace;
  --display:'Syne',sans-serif;
}
html,body{
  height:100%;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--display);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
}
#field{position:fixed;inset:0;z-index:0;pointer-events:none}
#shell{
  position:relative;z-index:1;
  width:100%;max-width:430px;
  height:100dvh;
  margin:0 auto;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:40px 32px;
  gap:0;
}
@media(min-width:500px){
  body{display:flex;align-items:center;justify-content:center;overflow:auto}
  #shell{
    height:min(820px,92dvh);
    border-radius:24px;
    border:1px solid var(--line2);
    overflow:hidden;
    box-shadow:0 60px 120px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);
  }
}
.eyebrow{
  font-family:var(--mono);
  font-size:10px;letter-spacing:3px;
  text-transform:uppercase;
  color:var(--ink3);
  margin-bottom:10px;
}
.logo{
  font-family:var(--display);
  font-weight:800;
  font-size:clamp(64px,18vw,88px);
  line-height:.9;
  letter-spacing:-2px;
  background:linear-gradient(135deg,var(--g1) 0%,var(--g2) 50%,var(--g3) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:28px;
}
.divider{
  width:40px;height:1px;
  background:var(--line2);
  margin-bottom:28px;
}
.tagline{
  font-size:16px;font-weight:400;
  line-height:1.7;color:var(--ink2);
  text-align:center;max-width:280px;
  margin-bottom:40px;
}
.steam-badge{
  display:flex;align-items:center;gap:12px;
  padding:14px 22px;
  background:var(--paper3);
  border:1px solid var(--line2);
  border-radius:14px;
  margin-bottom:16px;
  width:100%;max-width:300px;
}
.steam-icon{
  width:28px;height:28px;flex-shrink:0;
  opacity:.85;
}
.steam-text{}
.steam-label{
  font-family:var(--mono);font-size:9px;
  letter-spacing:2px;text-transform:uppercase;
  color:var(--ink3);margin-bottom:2px;
}
.steam-name{
  font-size:14px;font-weight:600;color:var(--ink);
}
.pill-row{
  display:flex;gap:8px;margin-bottom:44px;flex-wrap:wrap;justify-content:center;
}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:99px;
  font-family:var(--mono);font-size:10px;
  letter-spacing:1.5px;text-transform:uppercase;
  border:1px solid var(--line2);color:var(--ink3);
  background:var(--paper3);
}
.back-link{
  font-family:var(--mono);font-size:10px;
  letter-spacing:2px;text-transform:uppercase;
  color:var(--ink3);text-decoration:none;
  border-bottom:1px solid var(--line);
  padding-bottom:2px;
  transition:color .15s,border-color .15s;
}
.back-link:hover{color:var(--ink);border-color:var(--line2);}
.notify-btn{
  display:flex;align-items:center;justify-content:center;
  width:100%;max-width:300px;
  height:52px;
  font-family:var(--display);font-size:14px;font-weight:600;
  background:var(--ink);color:var(--paper);
  border:none;border-radius:12px;
  cursor:pointer;
  transition:opacity .12s,transform .12s;
  margin-bottom:12px;
  text-decoration:none;
}
.notify-btn:hover{opacity:.9}
.notify-btn:active{transform:scale(.97)}
</style>
</head>
<body>
<canvas id="field"></canvas>
<div id="shell">
  <div class="eyebrow">frequency memory</div>
  <div class="logo">sound</div>
  <div class="divider"></div>
  <p class="tagline">Five tones. You listen, then recreate each one from memory. Coming to Steam.</p>

  <div class="steam-badge">
    <svg class="steam-icon" viewBox="0 0 24 24" fill="var(--ink)" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39l3.03-6.27a3.5 3.5 0 0 1-1.24-.62 3.5 3.5 0 0 1-1.24-2.67 3.5 3.5 0 0 1 3.5-3.5c.28 0 .55.04.81.1L16.5 6.5a5.5 5.5 0 0 0-4.5-2.33 5.5 5.5 0 0 0-5.5 5.5c0 .18.01.36.03.54L3.1 8.57A11.97 11.97 0 0 1 12 0zm2.26 10.16a2.5 2.5 0 0 0-2.5 2.5 2.5 2.5 0 0 0 2.5 2.5 2.5 2.5 0 0 0 2.5-2.5 2.5 2.5 0 0 0-2.5-2.5zM12 24c-.28 0-.55-.01-.82-.03l-2.9 6A12.02 12.02 0 0 0 12 24zm7.34-4.1a12 12 0 0 0 2.63-6.1l-5.4-2.23a3.5 3.5 0 0 1-3.3 2.35 3.5 3.5 0 0 1-.6-.05l-2.97 6.16c.43.1.88.16 1.3.16 1.62 0 3.1-.63 4.2-1.66l3.14 1.37z"/>
    </svg>
    <div class="steam-text">
      <div class="steam-label">coming soon to</div>
      <div class="steam-name">Steam</div>
    </div>
  </div>

  <div class="pill-row">
    <div class="pill">Windows</div>
    <div class="pill">Mac</div>
    <div class="pill">Linux</div>
  </div>

  <a class="back-link" href="https://dxxthly.github.io/shopdxxthly/">← back to dxxthly</a>
</div>

<script>
(function bgField(){
  const cv=document.getElementById('field');
  const cx=cv.getContext('2d');
  let t=0;
  function resize(){cv.width=innerWidth;cv.height=innerHeight}
  resize();addEventListener('resize',resize);
  function draw(){
    const w=cv.width,h=cv.height;
    cx.clearRect(0,0,w,h);
    cx.fillStyle='#0d0d10';cx.fillRect(0,0,w,h);
    const orbs=[
      [w*.7+Math.sin(t*.22)*w*.12,h*.28+Math.cos(t*.17)*h*.1,'rgba(255,107,53,.05)'],
      [w*.2+Math.cos(t*.19)*w*.1,h*.7+Math.sin(t*.23)*h*.08,'rgba(224,64,251,.04)'],
      [w*.5+Math.sin(t*.13)*w*.08,h*.5+Math.cos(t*.15)*h*.06,'rgba(0,229,255,.03)'],
    ];
    orbs.forEach(([ox,oy,col])=>{
      const r=Math.min(w,h)*.5;
      const g=cx.createRadialGradient(ox,oy,0,ox,oy,r);
      g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');
      cx.fillStyle=g;cx.fillRect(0,0,w,h);
    });
    t+=.006;requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
